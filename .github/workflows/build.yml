name: Build

on:
  push:
    branches: [main]
    # Тег vX.Y.Z — выпуск версии (см. задачу release и README, «Версии»).
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  macos:
    # Xcode 26: значок приложения в формате Icon Composer (.icon).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Юнит-тесты используют POSIX-пути, поэтому гоняем их здесь.
      - run: flutter test
      - run: flutter build macos --release
      - name: Версия из pubspec.yaml
        run: python3 tool/build_version.py
      # Свой сертификат подписи (см. tool/sign_macos.sh): временная связка из
      # секретов, доверие — только для подписи кода. Без секретов (форки) —
      # ad-hoc, как раньше.
      - name: Сертификат подписи
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "Секретов подписи нет — ad-hoc"; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain tool/signing/notcode-code-signing.pem
          rm "$RUNNER_TEMP/signing.p12"
      - name: DMG-образ
        run: tool/make_dmg.sh "$APP_VERSION"
      # archive: false — образ скачивается как есть, без обёртки в zip.
      - uses: actions/upload-artifact@v7
        with:
          path: build/installer/ClaudeLauncher-${{ env.APP_VERSION }}.dmg
          archive: false

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Windows-focused tests
        run: flutter test test/command_line_test.dart test/windows_package_test.dart test/windows_window_activation_test.dart test/windows_link_probe_transport_test.dart test/parallel_report_test.dart
      - run: flutter build windows --release
      - name: Версия из pubspec.yaml
        shell: pwsh
        run: |
          python tool/build_version.py
      - name: Установщик (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DAppFileVersion=$env:APP_FILE_VERSION" windows\installer\claude_launcher.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          path: build/installer/ClaudeLauncher-Setup-${{ env.APP_VERSION }}.exe
          archive: false
      # Переносная версия: распаковать папку целиком и запустить claude_launcher.exe.
      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeLauncher-windows-portable
          path: build/windows/x64/runner/Release/

  # Выпуск версии по тегу vX.Y.Z: GitHub Release с установщиками, текст — раздел
  # этой версии из CHANGELOG.md. Тег должен совпадать с версией в pubspec.yaml.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Версия тега и pubspec.yaml совпадают
        run: |
          # Полная версия, с меткой предварительной сборки (1.7.1-beta.1 и т. п.).
          version=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в pubspec.yaml версия $version"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Текст выпуска из CHANGELOG.md
        run: |
          tool/release_notes.sh "$APP_VERSION" > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::В CHANGELOG.md нет раздела ## $APP_VERSION"
            exit 1
          fi
      # v8: артефакты без zip (archive: false — DMG и установщик) скачиваются как
      # есть; v7 пытался распаковать их и падал.
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Файлы выпуска
        run: |
          mkdir release
          find dist -type f \( -name '*.dmg' -o -name 'ClaudeLauncher-Setup-*.exe' \) -exec cp {} release/ \;
          (cd dist/ClaudeLauncher-windows-portable && zip -qr "$GITHUB_WORKSPACE/release/ClaudeLauncher-$APP_VERSION-windows-portable.zip" .)
          test "$(ls release | wc -l)" -eq 3
          # Суммы для проверки скачанного: лаунчер и команды установки сверяют с ними.
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
          cat release/SHA256SUMS.txt
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "ClaudeLauncher $APP_VERSION" --notes-file notes.md
