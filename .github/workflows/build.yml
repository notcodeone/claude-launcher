name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Юнит-тесты используют POSIX-пути, поэтому гоняем их здесь.
      - run: flutter test
      - run: flutter build macos --release
      - name: Упаковать .app
        run: ditto -c -k --keepParent "build/macos/Build/Products/Release/Claude Launcher.app" ClaudeLauncher-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeLauncher-macos
          path: ClaudeLauncher-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeLauncher-windows
          path: build/windows/x64/runner/Release/
